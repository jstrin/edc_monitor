name: Render and Deploy Dashboard

# ─────────────────────────────────────────────────────────────────────────────
# Rendering cadence is driven EXTERNALLY. An always-on Debian thin client on
# the home LAN ('wallcal') runs a local-time cron that calls the
# workflow_dispatch API on a reliable schedule: every 30 min from 9:00 AM to
# 6:00 PM EDT, plus 10:00 PM and 6:00 AM.
#
# GitHub's own `schedule:` cron was throttled on the free tier — firing roughly
# once every few hours instead of on time — so it has been removed. The trigger
# script, fine-grained-PAT setup and crontab live in deploy/README.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Primary trigger: the external 'wallcal' cron (see deploy/README.md).
  workflow_dispatch:
  # Render on push to main (so config changes deploy immediately).
  push:
    branches: [main]

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # Without a UTF-8 locale, R writes non-ASCII characters as literal escapes
    # ("<U+2014>" instead of an em dash) into both the HTML and the plot images.
    # Pinning it here makes the render independent of the runner's defaults.
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Cache installed R packages so subsequent runs are ~1 min not ~4 min
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('.github/workflows/render.yml') }}
          restore-keys: r-pkgs-${{ runner.os }}-

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::googlesheets4
            any::dplyr
            any::tidyr
            any::lubridate
            any::ggplot2
            any::scales
            any::patchwork
            any::jsonlite
            any::knitr
            any::purrr
            any::rmarkdown

      - name: Render dashboard
        run: |
          set -o pipefail
          quarto render dashboard.qmd 2>&1 | tee /tmp/render.log

      # If the render fails, surface the R/Quarto error on the run summary page
      # so it can be read without expanding the raw job log.
      - name: Publish render log on failure
        if: failure()
        run: |
          {
            echo '### Render failed'
            echo '```'
            tail -n 200 /tmp/render.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Quarto renders dashboard.qmd → dashboard.html.
          # We publish the whole output dir; index redirect handles the root.
          path: "."

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
